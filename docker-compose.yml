name: ekokan

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ekokan-app
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-8080}
      - JWT_SECRET=${JWT_SECRET:-ekokan-default-secure-secret-min-thirty-two-chars-long-do-not-use-in-prod}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:8070,http://localhost:8080,http://127.0.0.1:8070}
      - STATIC_DIR=./web/dist
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/ekokan?sslmode=disable}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-s3}
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - MEDIA_BASE_URL=${MEDIA_BASE_URL}
    volumes:
      - ekokan-media:/app/data/media
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: ekokan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ekokan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ekokan-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ekokan"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ekokan-db:
  ekokan-media:
